[workspace]
resolver = "2"
members = [
    "crates/caf-core",
    "crates/caf-cli",
    "crates/caf-app",
    "crates/caf-xtask",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
authors = ["Cecep Saeful Azhar Hidayat <cecep.azhtech@gmail.com>"]
license = "MIT"
repository = "https://github.com/cecep-azhar/caframework"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
sysinfo = "0.32"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "unwind"
