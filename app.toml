[app]
name = "CAFramework"
slug = "caframework"
bundle_id = "com.fathforce.caframework"
version = "0.1.0-dev"
accent_color = "indigo"
error_prefix = "CAF"
description = "Privacy-first modular application starter framework"
brand = "CAFramework"

[window]
title = "CAFramework"
width = 1200
height = 800
min_width = 800
min_height = 600

[security]
master_password_required = true
profile_pin_enabled = true

[modules]
sample_slice_enabled = true
ai_assistant_enabled = true
pro_licensing_enabled = true
updater_enabled = true
crash_reporting_enabled = true
backup_restore_enabled = true

[roles]
default_role = "member"
allowed_roles = ["owner", "partner", "member", "child"]

[[menus]]
key = "notes"
label = "Notes"
href = "/"
icon = "notes"
description = "Encrypted personal notes vertical slice"

[billing]
enabled = true
product_code = "CAFRAMEWORK"
gcc_base_url = "http://127.0.0.1:8888"
offline_days = 7
refresh_hours = 6
currencies = ["IDR", "USD"]

[[billing.public_keys]]
kid = "gcc-2026-10"
ed25519 = "Su0nese5LuWHeNPFIz69p0HGUsdT49rnEn82fbtY2S8="
