[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
ignore = [
    # RUSTSEC-2024-0384: instant is unmaintained; brought in via notify 7.0 (no upstream fix yet)
    "RUSTSEC-2024-0384",
    # RUSTSEC-2024-0370: proc-macro-error unmaintained; brought in transitively via gtk/glib-macros
    "RUSTSEC-2024-0370",
    # RUSTSEC-2025-0081, 0075, 0080, 0100, 0098: unic-* crates unmaintained; brought in transitively via tauri-utils/urlpattern
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0098",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
