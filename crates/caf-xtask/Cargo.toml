[package]
name = "caf-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CAFramework xtask developer tool and app generator"

[lib]
name = "caf_xtask"
path = "src/lib.rs"

[[bin]]
name = "caf-xtask"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
minisign = "0.7"
rand = "0.8"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
syn = { version = "2.0.119", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
convert_case = "0.6.0"
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
tower-http = "0.7.1"
uuid = { version = "1.27.0", features = ["v4"] }
tower = { version = "0.5.3", features = ["util"] }
