[package]
name = "caf-migrator"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

tempfile = "3"

# Use caf-core for shared types if needed
caf-core = { path = "../caf-core" }

[[bin]]
name = "caf-migrator"
path = "src/main.rs"
