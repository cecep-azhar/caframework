[package]
name = "caf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CAFramework v2 core library — pure Rust, no GUI dependencies."

[lib]
name = "caf_core"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
rand = "0.8"
argon2 = "0.5"
secrecy = "0.8"
zeroize = "1.8"
hex = "0.4"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
async-trait = "0.1.92"
parking_lot = "0.12.5"
once_cell = "1.21.4"
chrono = "0.4.45"
regex = "1.13.1"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
ureq = { version = "3.1", features = ["json"] }
hmac = "0.12"
md-5 = "0.10"
notify = { version = "7", features = ["macos_kqueue"] }
ed25519-dalek = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.10"

