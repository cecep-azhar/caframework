[package]
name = "caf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "CAFramework v2 core library — pure Rust, no GUI dependencies. Vault, SSH engine, store, AI copilot logic."

[lib]
name = "caf_core"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
rand = "0.8"
argon2 = "0.5"
secrecy = "0.8"
zeroize = "1.8"
hex = "0.4"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
async-trait = "0.1.92"
parking_lot = "0.12.5"
once_cell = "1.21.4"
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "encryption", "alloc"] }
chrono = "0.4.45"
regex = "1.13.1"
uuid = { version = "1.26.1", features = ["v4"] }
# Blocking HTTP for the LLM endpoint. Replaces shelling out to `curl`, which put the API key
# in the process argv where any local user could read it off the process table.
ureq = { version = "3.1", features = ["json"] }
hmac = "0.12"
md-5 = "0.10"
notify = { version = "7", features = ["macos_kqueue"] }
suppaftp = { version = "10.0.2", features = ["native-tls"] }
# CAFramework Pro: verify signed licence tokens (already in the tree via ssh-key) and a stable
# per-machine id for device activation.
ed25519-dalek = "2"
portable-pty = "0.9"
[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.5"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }

[dev-dependencies]
serde_json.workspace = true
